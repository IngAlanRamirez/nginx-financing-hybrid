<ion-content [fullscreen]="true" class="auth-background">
  <!-- Background decorative elements -->
  <div class="background-shapes">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
    <div class="shape shape-4"></div>
  </div>

  <div class="auth-container">
    <div class="glass-card">
      <!-- Header -->
      <div class="auth-header">
        <div class="logo-container">
          <div class="logo-circle">
            <img src="assets/images/perfil.png" alt="Logo" class="logo-image" />
          </div>
        </div>
        <h1 class="auth-title">Bienvenido</h1>
        <p class="auth-subtitle">Inicia sesión en tu cuenta</p>
      </div>

      <!-- Login Form -->
      <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <div class="form-group">
          <div class="input-container">
            <ion-icon name="person-outline" class="input-icon"></ion-icon>
            <ion-input
              type="email"
              placeholder="Correo electrónico"
              formControlName="email"
              class="glass-input"
              [class.error]="email?.invalid && email?.touched"
            ></ion-input>
          </div>
          <div class="error-message" *ngIf="email?.invalid && email?.touched">
            <span *ngIf="email?.errors?.['required']"
              >El correo electrónico es requerido</span
            >
            <span *ngIf="email?.errors?.['email']"
              >Ingresa un correo electrónico válido</span
            >
          </div>
        </div>

        <div class="form-group">
          <div class="input-container">
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <ion-input
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Contraseña"
              formControlName="password"
              class="glass-input"
              [class.error]="password?.invalid && password?.touched"
            ></ion-input>
            <ion-icon
              [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
              class="password-toggle"
              (click)="togglePassword()"
            ></ion-icon>
          </div>
          <div
            class="error-message"
            *ngIf="password?.invalid && password?.touched"
          >
            <span *ngIf="password?.errors?.['required']"
              >La contraseña es requerida</span
            >
            <span *ngIf="password?.errors?.['minlength']"
              >La contraseña debe tener al menos 6 caracteres</span
            >
          </div>
        </div>

        <ion-button
          type="submit"
          expand="block"
          class="login-button"
          [disabled]="loginForm.invalid || isLoading"
        >
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
          <span *ngIf="!isLoading">Iniciar Sesión</span>
        </ion-button>
      </form>
    </div>
  </div>
</ion-content>
